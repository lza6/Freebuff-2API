# Freebuff2API CI/CD — Windows 桌面安装包构建 + 自动发布 Release
name: Build Windows Installer & Release

on:
  push:
    tags:
      - "v*"
    branches: [main]
  workflow_dispatch:

jobs:
  build-win:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          # 锁定与本地验证一致的版本，避免最新 stable 的 clippy 新 lint 触发 -D warnings
          toolchain: 1.95.0
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build gateway (release)
        run: cargo build --release
        env:
          CARGO_HTTP_PROXY: "" # GitHub Actions 直连

      - name: Run tests + clippy
        shell: bash
        env:
          CARGO_HTTP_PROXY: ""   # 隔离本机 .cargo/config.toml 代理（已移出 git，双保险）
          HTTP_PROXY: ""
          HTTPS_PROXY: ""
          ALL_PROXY: ""
        run: |
          set +e
          cargo test 2>&1 | tee /tmp/test.log; TEST_RC=${PIPESTATUS[0]}
          cargo clippy --all-targets -- -D warnings 2>&1 | tee /tmp/clippy.log; CLIPPY_RC=${PIPESTATUS[0]}
          echo "test rc=$TEST_RC clippy rc=$CLIPPY_RC"
          if [ "$TEST_RC" -ne 0 ]; then
            echo "::error title=cargo-test-failed::$(tail -n 40 /tmp/test.log | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$CLIPPY_RC" -ne 0 ]; then
            echo "::error title=cargo-clippy-failed::$(grep -E '^error|^warning|-->' /tmp/clippy.log | head -30 | tr '\n' '|' | cut -c1-6000)"
          fi
          if [ "$TEST_RC" -ne 0 ] || [ "$CLIPPY_RC" -ne 0 ]; then exit 1; fi

      - name: Setup Node (Electron)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci --no-audit --no-fund

      - name: Build NSIS installer
        working-directory: desktop
        run: npx electron-builder --win nsis
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: freebuff2api-windows
          path: desktop/dist/*.exe

      - name: Create/Update Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/dist/*.exe
          generate_release_notes: true
